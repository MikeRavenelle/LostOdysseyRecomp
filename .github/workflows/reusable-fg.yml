name: Reusable frame generation
on:
  push:
    branches: [feature/reusable-fg-fsr-d3d12-mfg]
    paths: [shared/frame_generation/**, tools/tests/frame_generation/**, .github/workflows/reusable-fg.yml]
  pull_request:
    paths: [shared/frame_generation/**, tools/tests/frame_generation/**, .github/workflows/reusable-fg.yml]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cmake -S tools/tests/frame_generation -B out/fg-core
      - run: cmake --build out/fg-core --config Release
      - run: ctest --test-dir out/fg-core -C Release --output-on-failure
