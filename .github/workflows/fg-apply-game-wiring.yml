name: Apply reviewed FG game wiring
on:
  push:
    branches: [feature/reusable-fg-fsr-d3d12-mfg]
    paths: [.github/fg-apply-game-wiring.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed source and publish branch checkpoint
        run: |
          set -euo pipefail
          python .github/fg-apply-game-wiring.py
          git diff --check
          git rm .github/fg-apply-game-wiring.py .github/workflows/fg-apply-game-wiring.yml
          git add LostOdysseyRecomp shared cmake tools .github
          git config user.name 'dotSlash'
          git config user.email 'freefrank21@gmail.com'
          git commit -m 'refactor(fg): share game camera and depth conversion across providers'
          git push origin HEAD:refs/heads/feature/reusable-fg-fsr-d3d12-mfg
