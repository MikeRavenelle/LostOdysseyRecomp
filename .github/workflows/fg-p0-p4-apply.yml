name: Validate and apply P0 P4 development patch
on:
  push:
    branches: [fix/p0-shutdown-p4-continuity-20260927]
    paths: [.github/workflows/fg-p0-p4-apply.yml]
permissions:
  contents: read
env:
  PATCH_SHA256: f3746a2ae859895c079e739d29abaaa5b04db5eca60e2f4d2d5294243c51c555
  PATCH_GZIP_BASE64: >-
    
jobs:
  contracts:
    if: github.repository == 'freefrank/LostOdysseyRecomp'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply checksum-verified patch to the exact baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "3b5162638bde283d886e6e492cfcf0c19dd6870b"
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          raw = gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_BASE64']))
          assert hashlib.sha256(raw).hexdigest() == os.environ['PATCH_SHA256']
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fg-p0-p4.patch'
          path.write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
      - name: Configure GPU-free contracts
        run: cmake -S tools/tests/streamline_fg -B build/fg-contracts -DLO_STREAMLINE_FG_CPU_ONLY=ON
      - name: Build
        run: cmake --build build/fg-contracts --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/fg-contracts -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-p4-contracts-${{ matrix.os }}
          path: build/fg-contracts/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: contracts
    if: github.repository == 'freefrank/LostOdysseyRecomp' && github.ref == 'refs/heads/fix/p0-shutdown-p4-continuity-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated patch and fast-forward development branch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          raw = gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_BASE64']))
          assert hashlib.sha256(raw).hexdigest() == os.environ['PATCH_SHA256']
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fg-p0-p4.patch'
          path.write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fg): enforce cancellation and owner shutdown, wire FSR continuity'
          git push origin HEAD:refs/heads/fix/p0-shutdown-p4-continuity-20260927
          echo "Applied commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
