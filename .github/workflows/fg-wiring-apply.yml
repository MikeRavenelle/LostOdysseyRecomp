name: Commit reviewed FG game wiring
on:
  push:
    branches: [feature/reusable-fg-fsr-d3d12-mfg]
    paths: [.github/fg-wiring.part0, .github/fg-wiring.part1, .github/fg-wiring.part2, .github/workflows/fg-wiring-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Commit source only without changing workflow files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,re,subprocess
          from pathlib import Path
          data=''.join(Path(f'.github/fg-wiring.part{i}').read_text().strip() for i in range(3))
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='7965ffd405b5051b8e038c65b00cda9aca3eec38360a60106653df0d21581348', 'transport mismatch'
          for block in re.split(r'^diff --git ',patch.decode(),flags=re.M)[1:]:
              path=block.splitlines()[0].split(' b/',1)[1]
              old=re.search(r'^index ([0-9a-f]{40})\.\.',block,re.M).group(1)
              if old!='0'*40:
                  actual=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
                  assert actual==old, f'base changed: {path}'
          args=['git','apply','--index','--unidiff-zero','--whitespace=nowarn','--exclude=.github/workflows/fg-game-integration.yml']
          subprocess.run(args+['--check'],input=patch,check=True)
          subprocess.run(args,input=patch,check=True)
          PY
          git diff --cached --check -- . ':!tools/patches/plume-lostodyssey.patch'
          git rm .github/fg-wiring.part0 .github/fg-wiring.part1 .github/fg-wiring.part2
          git config user.name 'dotSlash'
          git config user.email 'freefrank21@gmail.com'
          git commit -m 'feat(fg): wire reusable providers into D3D12 game presentation'
          git push origin HEAD:refs/heads/feature/reusable-fg-fsr-d3d12-mfg
