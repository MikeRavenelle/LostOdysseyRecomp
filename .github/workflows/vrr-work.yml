name: VRR integration checkpoint
on:
  push:
    branches: [feature/native-90-120fps]
    paths: [.github/workflows/vrr-work.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'freefrank/LostOdysseyRecomp'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked public code
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD -o vrr-source.tar.gz
          git rev-parse HEAD > SOURCE_REF.txt
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume archive --format=tar.gz HEAD -o "$GITHUB_WORKSPACE/plume-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: vrr-source
          path: |
            vrr-source.tar.gz
            plume-source.tar.gz
            SOURCE_REF.txt
          retention-days: 1
          compression-level: 0
