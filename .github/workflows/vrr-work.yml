name: Apply reviewed VRR integration
on:
  push:
    branches: [feature/native-90-120fps]
    paths:
      - .github/workflows/vrr-work.yml
      - tools/patches/vrr-integration.gz.part1
      - tools/patches/vrr-integration.gz.part2
permissions:
  contents: write
concurrency:
  group: native-vrr-integration
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'freefrank/LostOdysseyRecomp' && github.ref == 'refs/heads/feature/native-90-120fps'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply source changes
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/vrr-integration.patch"
          cat tools/patches/vrr-integration.gz.part1 tools/patches/vrr-integration.gz.part2 | gzip -dc > "$patch"
          echo "a402f2a4a7b588846d1c36b76a4cf387a5c5c6c682f7e76da7b40dd2252bd650  $patch" | sha256sum -c -
          git apply --index --check "$patch"
          git apply --index "$patch"
          git diff --cached --check
          git submodule update --init --depth 1 thirdparty/plume
          git -C thirdparty/plume apply --check ../../tools/patches/plume-lostodyssey.patch
      - name: Focused CPU and menu checks
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/tests/vrr -B "$RUNNER_TEMP/vrr-build"
          cmake --build "$RUNNER_TEMP/vrr-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/vrr-build" --output-on-failure
          g++ -std=c++20 -Wall -Wextra -Werror -ILostOdysseyRecomp tools/tests/frame_pacer_test.cpp -o "$RUNNER_TEMP/frame-pacer"
          "$RUNNER_TEMP/frame-pacer"
          cmake -S tools/tests/settings_menu -B "$RUNNER_TEMP/vrr-menu"
          cmake --build "$RUNNER_TEMP/vrr-menu" --target LoSettingsInteraction --parallel 2
          ctest --test-dir "$RUNNER_TEMP/vrr-menu" --output-on-failure -R '^settings_interaction$'
          echo 'CPU_AND_MENU_FIXTURES_ONLY: no full game build, GPU run or hardware VRR acceptance'
      - name: Commit verified source to requested branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat(vrr): wire FreeSync and G-SYNC Compatible presentation and FG-aware pacing'
          git push origin HEAD:refs/heads/feature/native-90-120fps
          git rev-parse HEAD
