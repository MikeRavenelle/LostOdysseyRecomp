name: PR73 affected attachment and trace checks
on:
  push:
    branches: [fix/p0-shutdown-p4-continuity-20260927]
    paths: [.github/workflows/pr73-validation-apply.yml]
permissions:
  contents: read
jobs:
  affected:
    if: github.repository == 'freefrank/LostOdysseyRecomp'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check exact baseline and apply reviewed patch
        run: python tools/pr73-validation-patch/apply.py
      - name: Configure CPU-only helpers
        run: cmake -S tools/tests/streamline_fg -B build/pr73-validation-fix -DLO_STREAMLINE_FG_CPU_ONLY=ON
      - name: Build only affected helper targets
        run: cmake --build build/pr73-validation-fix --config Release --target LoDrawAttachmentPolicyTest LoVulkanObjectTraceTest --parallel 2
      - name: Run only affected helper tests
        run: ctest --test-dir build/pr73-validation-fix -C Release -R '^(draw_attachment_policy|vulkan_object_trace_.*)$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr73-attachment-trace-${{ matrix.os }}
          path: build/pr73-validation-fix/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
  apply:
    needs: affected
    if: github.repository == 'freefrank/LostOdysseyRecomp' && github.ref == 'refs/heads/fix/p0-shutdown-p4-continuity-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply checked source to development branch only
        shell: bash
        run: |
          python tools/pr73-validation-patch/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(renderer): match depth-only attachments and add bounded Vulkan object attribution'
          git push origin HEAD:refs/heads/fix/p0-shutdown-p4-continuity-20260927
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
