name: FG P3 production handoff
on:
  pull_request:
    paths:
      - LostOdysseyRecomp/gpu/**
      - tools/tests/frame_generation_handoff_renderer.inc
      - tools/tests/native_dlss_renderer_gpu_test.cpp
      - tools/tests/frame_generation_snapshot_gpu_test.cpp
      - tools/tests/video_submission_stop_test.cpp
      - tools/tests/motion_replay/**
      - .github/workflows/fg-p3-handoff-check.yml
  push:
    branches: [main]
    paths:
      - LostOdysseyRecomp/gpu/**
      - tools/tests/frame_generation_handoff_renderer.inc
      - tools/tests/motion_replay/**
      - .github/workflows/fg-p3-handoff-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fg-p3-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize pinned public dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 thirdparty/plume tools/XenosRecomp tools/XenonRecomp thirdparty/unordered_dense
          git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume submodule update --init --depth 1 contrib/volk contrib/Vulkan-Headers contrib/VulkanMemoryAllocator
          git -C tools/XenosRecomp submodule update --init --recursive --depth 1
          git -C tools/XenonRecomp submodule update --init --depth 1 thirdparty/tomlplusplus
      - name: Install Linux fixture dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libx11-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libzstd-dev
          mkdir -p out/dxc
          curl --fail --location --retry 2 https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505.1/linux_dxc_2025_07_14.x86_64.tar.gz -o out/dxc.tar.gz
          echo 'f2213da1fc99dc8778c8823078e16ba97c7f80f86a1d4520ab1adf4b462bc48c  out/dxc.tar.gz' | sha256sum -c -
          tar -xzf out/dxc.tar.gz -C out/dxc
      - name: Build actual Linux renderer and video boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cmake -S tools/tests/motion_replay -B out/p3-gpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DLO_ENABLE_DLSS=OFF -DLO_ENABLE_FSR=OFF -DLO_P2_VIDEO_COMPILE_CHECK=ON 2>&1 | tee out/p3-configure.log
          cmake --build out/p3-gpu --target LoNativeDlssRendererTest motion_renderer_compile p2_video_compile frame_generation_snapshot_gpu_test LoVideoSubmissionStopTest --parallel 2 2>&1 | tee out/p3-build.log
      - name: Real Vulkan handoff and affected snapshot tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/out/dxc/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -1)"
          test -n "$VK_ICD_FILENAMES"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          mkdir -p out/p3-validation
          printf 'khronos_validation.debug_action = VK_DBG_LAYER_ACTION_LOG_MSG\nkhronos_validation.report_flags = error\nkhronos_validation.enables = VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT\n' > out/p3-validation/vk_layer_settings.txt
          export VK_LAYER_SETTINGS_PATH="$PWD/out/p3-validation"
          ctest --test-dir out/p3-gpu -V -R '^frame_generation_(handoff_renderer|snapshot_renderer|snapshot_gpu)$' 2>&1 | tee out/p3-vulkan.log
          if grep -E 'Validation Error|VUID-|SYNC-HAZARD' out/p3-vulkan.log; then exit 1; fi
          out/p3-gpu/LoVideoSubmissionStopTest 2>&1 | tee out/p3-stop.log
      - name: Prepare Windows SDL and D3D12 headers only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git submodule update --init --depth 1 thirdparty/SDL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C thirdparty/plume submodule update --init --depth 1 contrib/D3D12MemoryAllocator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows clang-cl production compile and link
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          cmake -S tools/tests/motion_replay -B out/p3-gpu -G 'Visual Studio 17 2022' -A x64 -T ClangCL -DLO_ENABLE_DLSS=OFF -DLO_ENABLE_FSR=OFF -DLO_P2_VIDEO_COMPILE_CHECK=ON -DLO_P2_VIDEO_SDL_HEADERS="$pwd/thirdparty/SDL/include" 2>&1 | Tee-Object out/p3-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/p3-gpu --config Release --target LoNativeDlssRendererTest motion_renderer_compile p2_video_compile frame_generation_snapshot_gpu_test LoVideoSubmissionStopTest --parallel 2 2>&1 | Tee-Object out/p3-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_COMPILE_ONLY: no NVIDIA device or physical display validation claimed'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fg-p3-${{ runner.os }}
          path: |
            out/p3-*.log
            out/p3-gpu/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
